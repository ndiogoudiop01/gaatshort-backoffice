server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # CapRover termine TLS en amont : c'est lui qui voit le vrai schéma et le
  # vrai hôte. Les conserver est indispensable ici — le sous-domaine est ce
  # qui identifie le tenant côté API.
  absolute_redirect off;

  # ---------------------------------------------------------------------------
  #  En-têtes de sécurité — dans un snippet, inclus ICI et dans CHAQUE
  #  `location` qui pose son propre `add_header`.
  #
  #  Piège nginx : un `location` qui contient un seul `add_header` n'hérite
  #  plus d'AUCUN `add_header` du niveau `server`. Sans ces inclusions,
  #  index.html, config.js et assets/ partaient sans CSP ni X-Frame-Options.
  # ---------------------------------------------------------------------------
  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ---------------------------------------------------------------------------
  #  Cache
  # ---------------------------------------------------------------------------

  # Les fichiers de `assets/` portent une empreinte dans leur nom : leur contenu
  # ne change jamais sous un même nom, on peut donc les figer.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Les sourcemaps sont produites (pour dépouiller une pile d'erreur) mais NON
  # servies : publiées, elles offriraient le code source complet à qui le
  # demande. Elles restent accessibles dans l'image et les artefacts de CI.
  location ~ \.map$ {
    return 404;
  }

  # Configuration d'exécution : écrite à chaque démarrage du conteneur, donc
  # jamais cachée. La mettre en cache ferait pointer un conteneur redémarré
  # vers l'API précédente.
  location = /config.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # ---------------------------------------------------------------------------
  #  Sonde de vivacité — le conteneur ne sert que des fichiers, il est vivant
  #  s'il répond. Pas de sonde de disponibilité : il ne dépend de rien.
  # ---------------------------------------------------------------------------
  location = /healthz {
    include /etc/nginx/snippets/security-headers.conf;
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # ---------------------------------------------------------------------------
  #  SPA : toute route inconnue est rendue par le routeur côté client.
  # ---------------------------------------------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }
}
