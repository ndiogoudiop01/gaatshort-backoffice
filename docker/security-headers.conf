# ==============================================================================
#  En-têtes de sécurité du back-office — GABARIT.
#  Rendu par docker/entrypoint.sh vers /etc/nginx/snippets/security-headers.conf
#  (`__API_ORIGIN__` → origine de VITE_API_BASE_URL). Inclus par nginx.conf au
#  niveau `server` ET dans chaque `location` qui pose son propre `add_header`.
# ==============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Le back-office n'a besoin d'aucune de ces interfaces : les fermer réduit
# la surface qu'un script injecté pourrait atteindre.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# `style-src 'unsafe-inline'` est nécessaire : PrimeVue injecte ses jetons de
# thème dans une balise <style> à l'exécution. `script-src` reste strict —
# c'est là que se joue la protection du jeton de rafraîchissement, stocké
# dans localStorage (cf. docs/adr/0003-stockage-des-jetons.md).
# `__API_ORIGIN__` est remplacé au démarrage par l'entrypoint : c'est
# l'origine de VITE_API_BASE_URL quand l'API est sur un autre domaine
# (ex. https://impact-api.dev.zeroeau.sn), rien quand elle est relative.
# Sans cela, le navigateur bloquerait tout appel XHR vers l'API.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
